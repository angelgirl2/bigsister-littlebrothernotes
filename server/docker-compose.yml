services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bigsister}
      POSTGRES_USER: ${POSTGRES_USER:-bigsister}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigsister} -d ${POSTGRES_DB:-bigsister}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-bigsister}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-bigsister}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      MEDIA_DIR: /data/media
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SHARED_ROOM_KEY: ${SHARED_ROOM_KEY:-big-sister-private-room-change-me}
      LITTLE_BROTHER_PASSWORD: ${LITTLE_BROTHER_PASSWORD:-}
      BIG_SISTER_PASSWORD: ${BIG_SISTER_PASSWORD:-}
      LITTLE_BROTHER_LABEL: ${LITTLE_BROTHER_LABEL:-داداش کوچیکه}
      BIG_SISTER_LABEL: ${BIG_SISTER_LABEL:-آبجی بزرگ}
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  postgres_data:
  media_data:
