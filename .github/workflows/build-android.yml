name: Build Big Sister Notes Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: big-sister-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-${{ hashFiles('pubspec.lock') }}

      - name: Configure Android SDK path for CI
        shell: bash
        run: |
          set -euo pipefail
          flutter_bin="$(command -v flutter)"
          flutter_root="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$flutter_root" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Resolve API URL for this APK
        id: api-url
        shell: bash
        env:
          CONFIGURED_API_URL: ${{ vars.BIG_SISTER_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api_url="${CONFIGURED_API_URL:-}"
          if [[ -z "$api_url" ]]; then
            if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
              echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, or set BIG_SISTER_API_URL as a repository variable."
              exit 1
            fi
            api="https://api.cloudflare.com/client/v4"
            subdomain_response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
            echo "$subdomain_response" | jq -e '.success == true' >/dev/null
            worker_subdomain="$(echo "$subdomain_response" | jq -r '.result.subdomain // empty')"
            if [[ -z "$worker_subdomain" ]]; then
              echo "::error::No workers.dev subdomain is registered for this Cloudflare account. Run the Cloudflare deployment workflow first."
              exit 1
            fi
            api_url="https://big-sister-sync-cloudflare.$worker_subdomain.workers.dev"
          fi
          echo "url=$api_url" >> "$GITHUB_OUTPUT"
          echo "API URL is resolved from the registered Cloudflare subdomain."

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define="BIG_SISTER_API_URL=${{ steps.api-url.outputs.url }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-sister-notes-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
