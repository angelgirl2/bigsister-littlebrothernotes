name: Build Big Sister Notes Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: big-sister-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-${{ hashFiles('pubspec.lock') }}

      - name: Configure Android SDK path for CI
        shell: bash
        run: |
          set -euo pipefail
          flutter_bin="$(command -v flutter)"
          flutter_root="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$flutter_root" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Resolve API URL for this APK
        id: api-url
        shell: bash
        env:
          CONFIGURED_API_URL: ${{ vars.BIG_SISTER_API_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api_url="${CONFIGURED_API_URL:-}"
          if [[ -z "$api_url" ]]; then
            if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
              echo "::error::Neither BIG_SISTER_API_URL nor CLOUDFLARE_ACCOUNT_ID is set. Follow cloudflare/README_FA.md."
              exit 1
            fi
            account_prefix="${CLOUDFLARE_ACCOUNT_ID:0:8}"
            worker_subdomain="bigsisternotes-angelgirl2-$account_prefix"
            api_url="https://big-sister-sync-cloudflare.$worker_subdomain.workers.dev"
          fi
          echo "url=$api_url" >> "$GITHUB_OUTPUT"
          echo "API URL is configured for this APK."

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define="BIG_SISTER_API_URL=${{ steps.api-url.outputs.url }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-sister-notes-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
