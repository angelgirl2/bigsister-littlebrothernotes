name: Build Big Sister Notes Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

concurrency:
  group: big-sister-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BIG_SISTER_API_URL: ${{ vars.BIG_SISTER_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-${{ hashFiles('pubspec.lock') }}

      - name: Configure Android SDK path for CI
        shell: bash
        run: |
          set -euo pipefail
          flutter_bin="$(command -v flutter)"
          flutter_root="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          printf 'flutter.sdk=%s\n' "$flutter_root" > android/local.properties
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BIG_SISTER_API_URL:-}" ]]; then
            flutter build apk --release --dart-define="BIG_SISTER_API_URL=$BIG_SISTER_API_URL"
          else
            flutter build apk --release
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-sister-notes-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
