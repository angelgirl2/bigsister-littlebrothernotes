name: Deploy Big Sister API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "cloudflare/src/**"
      - "cloudflare/migrations/**"
      - "cloudflare/package.json"
      - "cloudflare/wrangler.toml"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: big-sister-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SHARED_ROOM_KEY: ${{ secrets.SHARED_ROOM_KEY }}
      LITTLE_BROTHER_PASSWORD: ${{ secrets.LITTLE_BROTHER_PASSWORD }}
      BIG_SISTER_PASSWORD: ${{ secrets.BIG_SISTER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate one-time Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID JWT_SECRET SHARED_ROOM_KEY LITTLE_BROTHER_PASSWORD BIG_SISTER_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret/variable: $name. Follow cloudflare/README_FA.md."
              exit 1
            fi
          done
          [[ "${#JWT_SECRET}" -ge 32 ]] || { echo "::error::JWT_SECRET must contain at least 32 characters."; exit 1; }
          [[ "${#SHARED_ROOM_KEY}" -ge 32 ]] || { echo "::error::SHARED_ROOM_KEY must contain at least 32 characters."; exit 1; }
          [[ "${#LITTLE_BROTHER_PASSWORD}" -ge 4 ]] || { echo "::error::LITTLE_BROTHER_PASSWORD must contain at least 4 characters."; exit 1; }
          [[ "${#BIG_SISTER_PASSWORD}" -ge 4 ]] || { echo "::error::BIG_SISTER_PASSWORD must contain at least 4 characters."; exit 1; }
          if [[ "$LITTLE_BROTHER_PASSWORD" == "$BIG_SISTER_PASSWORD" ]]; then
            echo "::error::Use different passwords for the two roles."
            exit 1
          fi
          echo "Required settings are present. Secret values are not printed."

      - name: Ensure workers.dev subdomain is registered
        id: workers-subdomain
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          endpoint="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          current="$(curl --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$endpoint")"
          subdomain="$(echo "$current" | jq -r 'if .success == true then (.result.subdomain // empty) else empty end')"

          if [[ -n "$subdomain" ]]; then
            echo "An account workers.dev subdomain is already registered; keeping it unchanged."
          else
            # Stable, account/repository-specific candidate. Existing subdomains are never replaced.
            candidate="bigsisternotes-angelgirl2-${CLOUDFLARE_ACCOUNT_ID:0:8}"
            echo "No workers.dev subdomain found; attempting one-time registration."
            created="$(curl --fail-with-body --silent --show-error -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"subdomain\":\"$candidate\"}" \
              "$endpoint")" || {
                echo "::error::Could not register a workers.dev subdomain. Ensure the Cloudflare API token has Workers Scripts: Edit permission and check Cloudflare dashboard onboarding."
                exit 1
              }
            echo "$created" | jq -e '.success == true and (.result.subdomain // "" != "")' >/dev/null || {
              echo "::error::Cloudflare rejected workers.dev subdomain registration. Check the API response in this job log (do not paste any tokens)."
              exit 1
            }
            subdomain="$(echo "$created" | jq -r '.result.subdomain')"
          fi

          echo "subdomain=$subdomain" >> "$GITHUB_OUTPUT"
          echo "workers.dev account subdomain is ready."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Wrangler CLI
        run: npm install --prefix cloudflare --no-audit --no-fund

      - name: Create or reuse D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          list="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?per_page=100")"
          echo "$list" | jq -e '.success == true' >/dev/null
          database_id="$(echo "$list" | jq -r '[.result[]? | select(.name == "big-sister-db")][0].uuid // empty')"
          if [[ -z "$database_id" ]]; then
            created="$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"big-sister-db"}' \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
            echo "$created" | jq -e '.success == true' >/dev/null
            database_id="$(echo "$created" | jq -r '.result.uuid // empty')"
          fi
          [[ "$database_id" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "::error::Cloudflare did not return a valid D1 database ID."
            exit 1
          }
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "D1 database is ready."

      - name: Apply D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${{ steps.d1.outputs.database_id }}/g" cloudflare/wrangler.toml
          grep -q "${{ steps.d1.outputs.database_id }}" cloudflare/wrangler.toml
          cd cloudflare
          npx wrangler d1 migrations apply big-sister-db --remote

      - name: Deploy Worker and Durable Object
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/cloudflare-deploy.log"

      - name: Configure Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare
          for name in JWT_SECRET SHARED_ROOM_KEY LITTLE_BROTHER_PASSWORD BIG_SISTER_PASSWORD; do
            printf '%s' "${!name}" | npx wrangler secret put "$name" --name big-sister-sync-cloudflare
          done

      - name: Check Worker health
        shell: bash
        run: |
          set -euo pipefail
          worker_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' "$RUNNER_TEMP/cloudflare-deploy.log" | tail -n 1 || true)"
          if [[ -z "$worker_url" ]]; then
            echo "::error::Deployment output did not include a workers.dev URL. Check Cloudflare Workers dashboard and deployment logs."
            exit 1
          fi
          healthy=false
          for attempt in {1..8}; do
            if curl --fail --silent --show-error "$worker_url/api/health" | tee "$RUNNER_TEMP/health.json" | jq -e '.ok == true and .provider == "cloudflare-workers"' >/dev/null; then
              healthy=true
              break
            fi
            sleep 5
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::Worker deployed, but /api/health did not return ready. Check D1 binding, migrations, Worker secrets, and workers.dev settings."
            exit 1
          fi
          {
            echo "### Big Sister Notes Cloudflare deployment succeeded"
            echo ""
            echo "- API URL: $worker_url"
            echo "- Health: $worker_url/api/health"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare Worker health check succeeded: $worker_url/api/health"
