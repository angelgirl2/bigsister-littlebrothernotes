name: bigsisterandlittlebrothernotes
publish_to: none
version: 6.2.0+9

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  file_picker: ^10.3.10
  share_plus: ^12.0.0
  record: ^6.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  local_auth: ^3.0.2
  pdf: ^3.13.0
  printing: ^5.15.0
  flutter_svg: ^2.3.0
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  flutter_secure_storage: ^10.3.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/


# App launcher icon source of truth: the same main logo used by the Flutter UI.
flutter_launcher_icons:
  android: true
  image_path: assets/logo.png
  adaptive_icon_background: "#02040A"
  adaptive_icon_foreground: assets/logo.png
